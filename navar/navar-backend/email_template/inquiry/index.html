<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="x-apple-disable-message-reformatting"><title>NavAR inquiry update</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;padding:0}body,table,td,p,a{font-family:'Poppins',Arial,Helvetica,sans-serif}table{border-spacing:0}img{border:0;outline:none}a{color:#278ac0}@media only screen and (max-width:570px){.outer{padding:20px 10px!important}.content{padding:24px 16px!important}.bubble{padding:14px!important}.action{display:block!important;width:auto!important}.footer-column{display:block!important;width:100%!important;text-align:center!important;padding:8px 0!important}}</style></head>
<body style="margin:0;padding:0;background:#e1f3ff;font-family:'Poppins',Arial,Helvetica,sans-serif;color:#34495e;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;"><tr><td align="center" style="padding:30px 10px 33px;">
<img src="{{BRANDING_URL}}/navar-icon-png.png" alt="NavAR logo" width="48" height="48" style="display:inline-block;vertical-align:middle;"> <img src="{{BRANDING_URL}}/navar-wordmark-png.png" alt="NavAR" width="130" style="display:inline-block;vertical-align:middle;height:auto;">
</td></tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="outer" align="center" style="padding:40px 12px;">
<!--[if mso]><table role="presentation" width="550" align="center"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:550px;width:100%;table-layout:fixed;background:#ffffff;border:4px solid #d9d8d8;">
<tr><td align="center" style="padding:40px 10px 10px;"><img src="{{BRANDING_URL}}/inbox-icon.png" width="157" alt="Inquiry update" style="display:inline-block;max-width:40%;height:auto;"></td></tr>
<tr><td class="content" style="padding:30px;word-wrap:break-word;overflow-wrap:anywhere;">
<p style="font-size:22px;line-height:1.4;font-weight:bold;margin:0 0 20px;">Hello {{CONTACT_NAME}}!</p>
<p style="font-size:18px;line-height:1.4;margin:0 0 20px;">An update about your inquiry for {{MALL_NAME}}:</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;table-layout:fixed;"><tr><td style="padding:16px 12px 0;"><table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="table-layout:fixed;">{{CONVERSATION}}</table></td></tr></table>
<p style="font-size:18px;line-height:1.4;margin:24px 0 20px;">{{ACTION_DESCRIPTION}}</p>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" bgcolor="#43a5dc" style="border:3px solid #ced4d9;border-radius:3px;"><a class="action" href="{{ACTION_URL}}" style="display:block;padding:15px 20px;color:#ffffff;text-decoration:none;font-size:16px;line-height:1.4;">{{ACTION_LABEL}}</a></td></tr></table>
<p style="font-size:18px;line-height:1.4;margin:30px 0 20px;">Feel free to reach out to us with any questions.</p>
<p style="font-size:18px;line-height:1.4;margin:0 0 30px;"><strong style="font-size:18px;">Thanks.</strong><br>NavAR Team</p>
</td></tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:550px;"><tr><td align="center" style="padding:28px 10px;">
<img src="{{BRANDING_URL}}/fb-icon.png" width="32" height="32" alt="Facebook" style="display:inline-block;margin:0 6px;"> <img src="{{BRANDING_URL}}/twitter-icon.png" width="32" height="32" alt="Twitter" style="display:inline-block;margin:0 6px;"> <img src="{{BRANDING_URL}}/linkedin-icon.png" width="32" height="32" alt="LinkedIn" style="display:inline-block;margin:0 6px;">
</td></tr><tr><td><table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td class="footer-column" width="50%" style="padding:10px;font-size:14px;line-height:1.8;color:#278ac0;">&copy; {{YEAR}} NavAR. All rights reserved.</td><td class="footer-column" width="50%" style="padding:10px;font-size:14px;line-height:1.8;text-align:right;">You received this email regarding your mall inquiry.</td></tr></table></td></tr></table>

</td></tr></table></body></html>
